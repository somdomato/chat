# Nginx Podman – espelha VPS2 (Oracle Linux 9)
#
# Porta 80   → KiwiIRC    (chat.somdomato.com em produção)
# Porta 8080 → Gamja      (gamja.somdomato.com em produção)
# Porta 8090 → The Lounge (lounge.somdomato.com em produção)

server {
    listen 80;
    server_name localhost chat.localhost;

    # Força re-resolução DNS a cada 10s (necessário no Podman)
    resolver 10.89.0.1 valid=10s;

    # KiwiIRC static files
    location / {
        root /usr/share/kiwiirc;
        try_files $uri $uri/ /index.html;
    }

    # Impede cache dos temas CSS para mudanças aparecerem imediatamente
    location ~* /static/themes/ {
        root /usr/share/kiwiirc;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # WebIRC Gateway (kiwiirc transport) → webircgateway:7778
    location /webirc {
        set $upstream http://webircgateway:7778;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ /\.ht { deny all; }
}

server {
    listen 8080;
    server_name localhost gamja.localhost;

    # Gamja static files (gerado no build)
    location / {
        root /usr/share/gamja/dist;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket direto para Ergo (porta 8097 – gamja bypassa webircgateway)
    location /webirc {
        proxy_pass http://ergo:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ /\.ht { deny all; }
}

server {
    listen 8090;
    server_name localhost lounge.localhost;

    # Força re-resolução DNS a cada 10s (necessário no Podman)
    resolver 10.89.0.1 valid=10s;

    # Proxy para The Lounge (servidor Node.js)
    location / {
        set $upstream http://thelounge:9000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ /\.ht { deny all; }
}
