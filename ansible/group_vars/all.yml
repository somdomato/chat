# Variáveis globais do projeto
---
# Domínios
domains:
  irc: "irc.somdomato.com"
  gamja: "gamja.somdomato.com"
  chat: "chat.somdomato.com"
  lounge: "lounge.somdomato.com"
  meet: "meet.somdomato.com"

# Email para Let's Encrypt
letsencrypt_email: "sistematico@gmail.com"

# Diretórios das aplicações
app_dirs:
  ergo: "/usr/share/ergo"
  kiwiirc: "/usr/share/kiwiirc"
  gamja: "/usr/share/gamja"
  webircgateway: "/opt/webircgateway"
  thelounge: "/opt/thelounge"
  jicofo: "/usr/share/jicofo"
  jvb: "/usr/share/jitsi-videobridge"
  jitsimeet: "/usr/share/jitsi-meet"

# Jitsi Meet self-hosted — instalação NATIVA (sem Docker), usada pelo plugin
# "conference" do KiwiIRC. Todos os componentes (jicofo, jvb, web,
# prosody-plugins) são extraídos diretamente dos .deb oficiais — são
# "all"/arquitetura-independente (jar + scripts ou JS/CSS já compilados),
# então funcionam em qualquer distro/arquitetura com JRE, incluindo Oracle
# Linux ARM, sem precisar compilar nada na própria VPS. Prosody vem do EPEL.
jitsi_jicofo_deb_version: "1.0-1183-1"
jitsi_jvb_deb_version: "2.3-295-g8d5c0037b-1"
jitsi_meet_web_deb_version: "1.0.9268-1"

# Diretório de backups
backup_dir: "/var/backups/sdm-chat"

# Usuários e grupos
ergo_user: "ergo"
ergo_group: "ergo"
soju_user: "soju"
soju_group: "soju"
soju_admin_user: "admin"
# soju_admin_password: definir no vault.yml
nginx_user: "nginx"
nginx_group: "nginx"

# Versões
ergo_version: "2.16.0"

# Configurações SSH
ansible_port: 2200
ansible_user: root
ansible_python_interpreter: "/usr/bin/python3"

# Configurações do sistema
refresh_apps: true

# Certificados SSL
ssl_cert_dir: "/etc/letsencrypt/live"
ssl_renewal_hooks_dir: "/etc/letsencrypt/renewal-hooks/deploy"
