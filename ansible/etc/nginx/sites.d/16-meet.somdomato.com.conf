# Jitsi Meet self-hosted — instalação nativa (sem Docker), servida
# diretamente pelo Nginx do host. Baseado em
# https://github.com/jitsi/jitsi-meet/blob/master/doc/debian/jitsi-meet/jitsi-meet.example
# (simplificado para domínio único, sem multidomain/JaaS).
upstream prosody_meet {
    server 127.0.0.1:5280;
    keepalive 2;
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.somdomato.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/meet.somdomato.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.somdomato.com/privkey.pem;

    server_name meet.somdomato.com;

    root /usr/share/jitsi-meet;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/x-icon application/octet-stream application/wasm;

    location = /config.js {
        alias /etc/jitsi/meet/meet.somdomato.com-config.js;
    }

    location = /external_api.js {
        alias /usr/share/jitsi-meet/libs/external_api.min.js;
    }

    location ~ ^/(libs|css|static|images|fonts|lang|sounds)/(.*)$ {
        add_header 'Access-Control-Allow-Origin' '*';
        alias /usr/share/jitsi-meet/$1/$2;
        if ($arg_v) {
            expires 1y;
        }
    }

    # BOSH
    location = /http-bind {
        proxy_pass http://prosody_meet/http-bind?$args;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # XMPP websockets
    location = /xmpp-websocket {
        proxy_pass http://prosody_meet/xmpp-websocket?$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        tcp_nodelay on;
    }

    # API REST do jicofo (pré-alocação de conferência) — opcional
    location ~ ^/conference-request/v1(/.*)?$ {
        proxy_pass http://127.0.0.1:8888/conference-request/v1$1;
        add_header 'Access-Control-Allow-Origin' '*';
    }

    # Qualquer outra coisa que não seja um arquivo real é nome de sala -> index.html
    location / {
        try_files $uri @root_path;
    }

    location @root_path {
        rewrite ^/(.*)$ /index.html break;
    }

    location ~ /\.ht { deny all; }
}
