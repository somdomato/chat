server {
    listen 80;
    listen [::]:80;
    server_name irc.somdomato.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/irc.somdomato.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irc.somdomato.com/privkey.pem;

    server_name irc.somdomato.com;

    # KiwiIRC — webchat estático
    # Conexões IRC diretas (soju, clientes IRC) usam a porta 6697 TLS
    # diretamente no Ergo, sem passar pelo nginx.
    location / {
        root /usr/share/kiwiirc;
        try_files $uri $uri/ /index.html;
    }

    # Impede cache dos temas CSS para mudanças aparecerem imediatamente
    location ~* /static/themes/ {
        root /usr/share/kiwiirc;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # WebSocket IRC via WebIRC Gateway
    location /webirc {
        proxy_pass http://127.0.0.1:8067;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    location ~ /\.ht { deny all; }
}

