---
- name: Preparar o ambiente para o Ergo, KiwiIRC, The Lounge e WebIRC Gateway
  hosts: all
  become: true
  remote_user: "{{ ansible_user }}"
  gather_subset:
    - "!hardware"
    - "!facter"
    - "!ohai"
  vars_files:
    - group_vars/vault.yml

  tasks:
    # Detecção do sistema operacional e configuração de gerenciador de pacotes
    - name: Detectar família do sistema operacional
      ansible.builtin.set_fact:
        pkg_manager: "{{ 'dnf' if ansible_facts['os_family'] == 'RedHat' else 'apt' }}"
        is_rhel_family: "{{ ansible_facts['os_family'] == 'RedHat' }}"
        is_debian_family: "{{ ansible_facts['os_family'] == 'Debian' }}"

    # ===== BACKUP DAS CONFIGURAÇÕES EXISTENTES =====
    - name: Definir timestamp para backup
      ansible.builtin.set_fact:
        backup_timestamp: "{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

    - name: Criar diretório de backup com timestamp
      ansible.builtin.file:
        path: "{{ backup_dir }}/{{ backup_timestamp }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Fazer backup das configurações existentes
      ansible.builtin.archive:
        path: "{{ item.path }}"
        dest: "{{ backup_dir }}/{{ backup_timestamp }}/{{ item.name }}.tar.gz"
        format: gz
        exclude_path: "{{ item.exclude | default(omit) }}"
      loop:
        - { path: "/etc/nginx/sites.d", name: "nginx-sites" }
        - { path: "/etc/kiwiirc", name: "kiwiirc-config" }
        - { path: "{{ app_dirs.kiwiirc }}", name: "kiwiirc-app" }
        - { path: "/etc/thelounge", name: "thelounge-config" }
      loop_control:
        label: "{{ item.name }}"
      failed_when: false

    - name: Fazer backup do diretório do Ergo
      ansible.builtin.archive:
        path: "{{ app_dirs.ergo }}"
        dest: "{{ backup_dir }}/{{ backup_timestamp }}/ergo-app.tar.gz"
        format: gz
        exclude_path:
          - "{{ app_dirs.ergo }}/languages"
      failed_when: false

    - name: Fazer backup do diretório do Gamja
      ansible.builtin.archive:
        path: "{{ app_dirs.gamja }}"
        dest: "{{ backup_dir }}/{{ backup_timestamp }}/gamja-app.tar.gz"
        format: gz
        exclude_path:
          - "{{ app_dirs.gamja }}/node_modules"
      failed_when: false

    - name: Fazer backup dos serviços systemd do SDM
      ansible.builtin.shell: >
        tar czf {{ backup_dir }}/{{ backup_timestamp }}/systemd-services.tar.gz
        $(ls /etc/systemd/system/somdomato-*.service
        /etc/systemd/system/ergo.service
        /etc/systemd/system/webircgateway.service 2>/dev/null) 2>/dev/null || true
      changed_when: false
      when: backup_systemd_services

    - name: Fazer backup das configurações de renovação e certificados do Let's Encrypt
      ansible.builtin.archive:
        path: "{{ item.path }}"
        dest: "{{ backup_dir }}/{{ backup_timestamp }}/{{ item.name }}.tar.gz"
        format: gz
      loop:
        - { path: "/etc/letsencrypt/renewal", name: "letsencrypt-renewal" }
        - { path: "/etc/letsencrypt/live", name: "letsencrypt-live" }
      loop_control:
        label: "{{ item.name }}"
      failed_when: false

    # ===== ATUALIZAÇÃO DE CACHE DE PACOTES =====
    - name: Atualizar cache de pacotes (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: is_debian_family

    - name: Atualizar cache de pacotes (Oracle Linux/RHEL/Rocky)
      ansible.builtin.dnf:
        update_cache: yes
      when: is_rhel_family

    - name: Corrigir pacotes quebrados se houver (Debian/Ubuntu)
      ansible.builtin.command: apt-get -f install -y
      register: fix_broken
      failed_when: fix_broken.rc not in [0, 100]
      changed_when: fix_broken.rc == 0
      when: is_debian_family

    - name: Verificar se Node.js já está instalado
      ansible.builtin.command: node --version
      register: nodejs_check
      failed_when: false
      changed_when: false

    - name: Verificar se npm já está instalado
      ansible.builtin.command: npm --version
      register: npm_check
      failed_when: false
      changed_when: false

    - name: Remover pacotes npm/nodejs conflitantes do sistema (apenas se necessário)
      ansible.builtin.package:
        name:
          - npm
          - nodejs
        state: absent
      register: remove_packages_result
      failed_when: remove_packages_result.rc != 0 and "No packages found" not in remove_packages_result.stderr
      when: nodejs_check.rc != 0 or npm_check.rc != 0

    - name: Executar autoremove para limpar dependências órfãs
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
      when: is_debian_family

    - name: Instalar dependências básicas e certbot (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - curl
          - gnupg
          - ca-certificates
          - apt-transport-https
          - software-properties-common
          - unzip
          - certbot
          - python3-certbot-dns-cloudflare
        state: present
      when: is_debian_family

    - name: Instalar dependências básicas e certbot (Oracle Linux/RHEL/Rocky)
      ansible.builtin.package:
        name:
          - curl
          - gnupg2
          - ca-certificates
          - unzip
          - policycoreutils
          - policycoreutils-python-utils
          - selinux-policy-targeted
          - certbot
          - python3-certbot-dns-cloudflare
        state: present
      when: is_rhel_family

    - name: Instalar nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Instalar Go (necessário para compilar soju)
      ansible.builtin.package:
        name: golang
        state: present

    - name: Verificar se soju e sojuctl já estão instalados
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/soju
        - /usr/local/bin/sojuctl
      register: soju_binaries

    - name: Compilar e instalar soju do fonte
      ansible.builtin.shell: |
        export HOME=/root
        export GOPATH=/root/go
        go install git.sr.ht/~emersion/soju/cmd/soju@latest
        cp /root/go/bin/soju /usr/local/bin/soju
        chmod 755 /usr/local/bin/soju
      when: not soju_binaries.results[0].stat.exists
      changed_when: true

    - name: Compilar e instalar sojuctl do fonte
      ansible.builtin.shell: |
        export HOME=/root
        export GOPATH=/root/go
        go install git.sr.ht/~emersion/soju/cmd/sojuctl@latest
        cp /root/go/bin/sojuctl /usr/local/bin/sojuctl
        chmod 755 /usr/local/bin/sojuctl
      when: not soju_binaries.results[1].stat.exists
      changed_when: true

    - name: Verificar se soju foi instalado com sucesso
      ansible.builtin.stat:
        path: /usr/local/bin/soju
      register: soju_check
      failed_when: not soju_check.stat.exists

    - name: Verificar se sojuctl foi instalado com sucesso
      ansible.builtin.stat:
        path: /usr/local/bin/sojuctl
      register: sojuctl_check
      failed_when: not sojuctl_check.stat.exists

    # Node.js installation - compatível com múltiplas distros

    - name: Baixar e adicionar chave GPG do NodeSource (Debian/Ubuntu)
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
        dest: /tmp/nodesource.gpg.key
        mode: "0644"
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and is_debian_family

    - name: Adicionar chave GPG do NodeSource ao keyring (Debian/Ubuntu)
      ansible.builtin.shell: |
        gpg --dearmor < /tmp/nodesource.gpg.key > /usr/share/keyrings/nodesource.gpg
        chmod 644 /usr/share/keyrings/nodesource.gpg
      args:
        creates: /usr/share/keyrings/nodesource.gpg
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and is_debian_family

    - name: Adicionar repositório NodeSource para Node.js 24.x (Debian/Ubuntu)
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: https://deb.nodesource.com/node_24.x
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /usr/share/keyrings/nodesource.gpg
        state: present
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and is_debian_family

    - name: Adicionar repositório NodeSource para Node.js 24.x (Oracle Linux/RHEL/Rocky)
      ansible.builtin.yum_repository:
        name: nodesource
        description: Node.js Packages for Enterprise Linux
        baseurl: "https://rpm.nodesource.com/pub_24.x/nodistro/repo/{{ ansible_facts['architecture'] }}/"
        gpgcheck: yes
        gpgkey: https://rpm.nodesource.com/pub/el/NODESOURCE-GPG-SIGNING-KEY-EL
        enabled: yes
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and is_rhel_family

    - name: Atualizar cache após adicionar repositório NodeSource (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and is_debian_family

    - name: Atualizar cache após adicionar repositório NodeSource (Oracle Linux/RHEL/Rocky)
      ansible.builtin.dnf:
        update_cache: true
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and is_rhel_family

    - name: Instalar Node.js via NodeSource
      ansible.builtin.package:
        name: nodejs
        state: present
      register: nodejs_install
      ignore_errors: true
      when: nodejs_check.rc != 0 or npm_check.rc != 0

    - name: Criar link simbólico para npm se instalado via snap
      ansible.builtin.file:
        src: /snap/node/current/bin/npm
        dest: /usr/local/bin/npm
        state: link
      when: (nodejs_check.rc != 0 or npm_check.rc != 0) and nodejs_install.failed

    # Configuração de SELinux para Oracle Linux/RHEL/Rocky
    - name: Verificar estado do SELinux
      ansible.builtin.command: getenforce
      register: selinux_status
      failed_when: false
      changed_when: false
      when: is_rhel_family

    - name: Configurar contextos SELinux para diretórios do Ergo
      community.general.sefcontext:
        target: "{{ app_dirs.ergo }}(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Configurar contextos SELinux para diretórios do KiwiIRC
      community.general.sefcontext:
        target: "{{ app_dirs.kiwiirc }}(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Configurar contextos SELinux para diretórios do Gamja
      community.general.sefcontext:
        target: "{{ app_dirs.gamja }}(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Configurar contextos SELinux para diretórios do WebIRC Gateway
      community.general.sefcontext:
        target: "{{ app_dirs.webircgateway }}(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Configurar contextos SELinux para diretórios do The Lounge
      community.general.sefcontext:
        target: "{{ app_dirs.thelounge }}(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Configurar contexto SELinux para executáveis
      community.general.sefcontext:
        target: "{{ item }}"
        setype: bin_t
        state: present
      loop:
        - "{{ app_dirs.ergo }}/ergo"
        - "{{ app_dirs.webircgateway }}/webircgateway"
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Permitir nginx conectar à rede (SELinux)
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Permitir nginx conectar a portas não-padrão (SELinux)
      ansible.posix.seboolean:
        name: httpd_can_network_relay
        state: yes
        persistent: yes
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    # O nginx (nginx-stable do nginx.org) roda no domínio httpd_t, mas o
    # arquivo /run/nginx.pid acaba sendo criado com o contexto genérico
    # var_run_t em vez de httpd_var_run_t (a transição automática do SELinux
    # não cobre esse caminho neste pacote). Resultado: "open() /run/nginx.pid
    # failed (13: Permission denied)". Registramos o contexto correto e
    # garantimos, via tmpfiles.d, que ele seja reaplicado em todo boot —
    # já que /run é tmpfs e é recriado do zero a cada reinício da VPS.
    - name: Registrar contexto SELinux correto para /run/nginx.pid
      community.general.sefcontext:
        target: '/run/nginx\.pid'
        setype: httpd_var_run_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Garantir que /run/nginx.pid exista com o contexto correto a cada boot
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/nginx.conf
        content: |
          f /run/nginx.pid 0644 nginx nginx -
        mode: "0644"
      when: is_rhel_family

    - name: Aplicar regra de tmpfiles.d imediatamente
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/nginx.conf
      changed_when: true
      when: is_rhel_family

    - name: Restaurar contexto SELinux de /run/nginx.pid agora
      ansible.builtin.command: restorecon -v /run/nginx.pid
      changed_when: true
      failed_when: false
      when: is_rhel_family and selinux_status.stdout == "Enforcing"
      notify: Reiniciar Nginx

    - name: Verificar quais diretórios de aplicação existem (SELinux)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ app_dirs.ergo }}"
        - "{{ app_dirs.kiwiirc }}"
        - "{{ app_dirs.gamja }}"
        - "{{ app_dirs.webircgateway }}"
        - "{{ app_dirs.thelounge }}"
      register: app_dirs_stat
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Aplicar contextos SELinux nos diretórios
      ansible.builtin.command: "restorecon -Rv {{ item.item }}"
      loop: "{{ app_dirs_stat.results }}"
      when:
        - is_rhel_family and selinux_status.stdout == "Enforcing"
        - item.stat is defined
        - item.stat.exists
      changed_when: true

    # Certificados SSL

    - name: Criar diretório de configuração do certbot
      ansible.builtin.file:
        path: /etc/letsencrypt
        state: directory
        mode: "0755"

    - name: Verificar se as credenciais do Cloudflare estão configuradas
      ansible.builtin.fail:
        msg: "Credenciais do Cloudflare não configuradas. Execute: ./scripts/vault.sh edit"
      when: >
        (cloudflare_email == "your_cloudflare_email_here" or cloudflare_email is undefined) or
        (cloudflare_api_key == "your_cloudflare_api_key_here" or cloudflare_api_key is undefined)

    - name: Criar arquivo de credenciais do Cloudflare (modo legacy)
      ansible.builtin.copy:
        content: |
          # Cloudflare API credentials used by Certbot (Legacy mode)
          dns_cloudflare_email = {{ cloudflare_email }}
          dns_cloudflare_api_key = {{ cloudflare_api_key }}
        dest: /etc/letsencrypt/cloudflare.ini
        owner: root
        group: root
        mode: "0600"
      no_log: true # Não mostra o conteúdo no log

    - name: Testar conectividade com Cloudflare API (modo legacy)
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/user"
        method: GET
        headers:
          X-Auth-Email: "{{ cloudflare_email }}"
          X-Auth-Key: "{{ cloudflare_api_key }}"
          Content-Type: "application/json"
        status_code: [200, 400, 401, 403]
      register: cloudflare_test
      no_log: true

    - name: Falhar se as credenciais do Cloudflare forem inválidas
      ansible.builtin.fail:
        msg: "Credenciais do Cloudflare inválidas. Verifique email e API key no vault."
      when: cloudflare_test.status != 200

    - name: Verificar se certificado SSL já existe
      ansible.builtin.stat:
        path: "{{ ssl_cert_dir }}/{{ domains.irc }}/fullchain.pem"
      register: ssl_cert_exists

    - name: Verificar se o certificado cobre todos os domínios esperados
      ansible.builtin.shell: |
        set -o pipefail
        for d in {{ domains.irc }} {{ domains.chat }} {{ domains.gamja }} {{ domains.lounge }} {{ domains.meet }}; do
          openssl x509 -in {{ ssl_cert_dir }}/{{ domains.irc }}/fullchain.pem -noout -text | grep -q "DNS:$d\b" || exit 1
        done
      args:
        executable: /bin/bash
      register: ssl_cert_covers_domains
      changed_when: false
      failed_when: false
      when: ssl_cert_exists.stat.exists

    - name: Obter certificados SSL para todos os domínios
      ansible.builtin.shell: |
        certbot certonly \
          --cert-name {{ domains.irc }} \
          --expand \
          --dns-cloudflare \
          --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
          --dns-cloudflare-propagation-seconds 60 \
          --email {{ letsencrypt_email }} \
          --agree-tos \
          --non-interactive \
          --keep-until-expiring \
          --verbose \
          -d {{ domains.irc }} \
          -d {{ domains.chat }} \
          -d {{ domains.gamja }} \
          -d {{ domains.lounge }} \
          -d {{ domains.meet }}
      register: certbot_result
      failed_when: false # Não falhar automaticamente para poder mostrar o erro
      when: not ssl_cert_exists.stat.exists or ssl_cert_covers_domains.rc != 0

    - name: Mostrar resultado detalhado do certbot
      ansible.builtin.debug:
        msg:
          - "Return code: {{ certbot_result.rc }}"
          - "STDOUT: {{ certbot_result.stdout }}"
          - "STDERR: {{ certbot_result.stderr }}"
      when: certbot_result is defined and certbot_result.rc is defined and certbot_result.rc != 0

    - name: Falhar se certificados não foram obtidos
      ansible.builtin.fail:
        msg: |
          Falha na obtenção de certificados SSL.
          certbot rc={{ certbot_result.rc }}
          stderr={{ certbot_result.stderr | default('') }}
          Para debug: ssh root@ananke -p 2200 && certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini -d {{ domains.irc }} --dry-run -v
      when: certbot_result is defined and certbot_result.rc is defined and certbot_result.rc != 0

    - name: Verificar se destinos dos links simbólicos são diretórios
      ansible.builtin.stat:
        path: "{{ ssl_cert_dir }}/{{ item }}"
      loop:
        - "{{ domains.chat }}"
        - "{{ domains.gamja }}"
        - "{{ domains.lounge }}"
        - "{{ domains.meet }}"
      register: symlink_dest_check

    - name: Remover diretórios existentes que impedem criação dos links simbólicos
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ symlink_dest_check.results }}"
      when:
        - item.stat is defined
        - item.stat.exists
        - item.stat.isdir
        - not item.stat.islnk

    - name: Criar links simbólicos dos certificados para chat.somdomato.com
      ansible.builtin.file:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}"
        dest: "{{ ssl_cert_dir }}/{{ domains.chat }}"
        state: link
        force: yes

    - name: Criar links simbólicos dos certificados para gamja.somdomato.com
      ansible.builtin.file:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}"
        dest: "{{ ssl_cert_dir }}/{{ domains.gamja }}"
        state: link
        force: yes

    - name: Criar links simbólicos dos certificados para lounge.somdomato.com
      ansible.builtin.file:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}"
        dest: "{{ ssl_cert_dir }}/{{ domains.lounge }}"
        state: link
        force: yes

    - name: Criar links simbólicos dos certificados para meet.somdomato.com
      ansible.builtin.file:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}"
        dest: "{{ ssl_cert_dir }}/{{ domains.meet }}"
        state: link
        force: yes

    - name: "Garante que o grupo exista: {{ ergo_group }}"
      ansible.builtin.group:
        name: "{{ ergo_group }}"
        state: present

    - name: "Adicionar o usuário ao grupo: {{ ergo_user }}"
      ansible.builtin.user:
        name: "{{ ergo_user }}"
        group: "{{ ergo_group }}"
        create_home: false # Adicionado para evitar criação de home desnecessária
        system: true # Define como usuário de sistema

    - name: "Garante que o grupo exista: {{ soju_group }}"
      ansible.builtin.group:
        name: "{{ soju_group }}"
        state: present

    - name: "Criar usuário de sistema: {{ soju_user }}"
      ansible.builtin.user:
        name: "{{ soju_user }}"
        group: "{{ soju_group }}"
        create_home: false
        system: true

    - name: "Garante que o grupo exista: {{ matterbridge_group }}"
      ansible.builtin.group:
        name: "{{ matterbridge_group }}"
        state: present

    - name: "Criar usuário de sistema: {{ matterbridge_user }}"
      ansible.builtin.user:
        name: "{{ matterbridge_user }}"
        group: "{{ matterbridge_group }}"
        create_home: false
        system: true

    - name: Copiar script de instalação de certificados do Let's Encrypt
      ansible.builtin.copy:
        src: "etc/letsencrypt/renewal-hooks/deploy/install-ergo-certificates"
        dest: "{{ ssl_renewal_hooks_dir }}/install-ergo-certificates"
        owner: root
        group: root
        mode: "0755"

    # Conteúdo nosso (overlay versionado no repo, não o app de terceiros) —
    # rápido e idempotente por natureza (rsync só copia o que mudou), então
    # roda sempre. O download/build dos apps de terceiros abaixo é que é
    # caro e fica atrás de "refresh_apps" + verificação de já-instalado.
    - name: Sincronizar arquivos de aplicação (overlay próprio)
      ansible.posix.synchronize:
        src: "usr/share/{{ item }}/"
        dest: "{{ app_dirs[item] }}/"
        delete: false
        recursive: true
        rsync_opts:
          - "--no-motd"
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "-e 'ssh -p {{ ansible_port }}'"
      loop:
        - gamja
        - kiwiirc

    - name: Verificar se o Ergo já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.ergo }}/ergo"
      register: ergo_installed

    - name: Determinar arquitetura para download do Ergo
      ansible.builtin.set_fact:
        ergo_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"

    - name: Baixar Ergo v{{ ergo_version }} para {{ ergo_arch }}
      ansible.builtin.unarchive:
        src: "https://github.com/ergochat/ergo/releases/download/v{{ ergo_version }}/ergo-{{ ergo_version }}-linux-{{ ergo_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: refresh_apps or not ergo_installed.stat.exists

    - name: Criar diretório do Ergo
      ansible.builtin.file:
        path: "{{ app_dirs.ergo }}"
        state: directory
        owner: "{{ ergo_user }}"
        group: "{{ ergo_group }}"
        mode: "0755"

    - name: Instalar binário do Ergo
      ansible.builtin.copy:
        src: "/tmp/ergo-{{ ergo_version }}-linux-{{ ergo_arch }}/ergo"
        dest: "{{ app_dirs.ergo }}/ergo"
        owner: "{{ ergo_user }}"
        group: "{{ ergo_group }}"
        mode: "0755"
        remote_src: true
      when: refresh_apps or not ergo_installed.stat.exists

    - name: Copiar arquivos de configuração do Ergo
      ansible.posix.synchronize:
        src: "usr/share/ergo/"
        dest: "{{ app_dirs.ergo }}/"
        delete: false
        recursive: true
        rsync_opts:
          - "--no-motd"
          - "--exclude=ergo"
          - "-e 'ssh -p {{ ansible_port }}'"

    - name: Limpar download temporário do Ergo
      ansible.builtin.file:
        path: "/tmp/ergo-{{ ergo_version }}-linux-{{ ergo_arch }}"
        state: absent

    # Baixar e instalar KiwiIRC do GitHub
    - name: Verificar se o KiwiIRC já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.kiwiirc }}/index.html"
      register: kiwiirc_installed

    - name: Criar diretório temporário para download do KiwiIRC
      ansible.builtin.file:
        path: /tmp/kiwiirc_download
        state: directory
        mode: "0755"
      when: refresh_apps or not kiwiirc_installed.stat.exists

    - name: Baixar KiwiIRC v1.7.1 do GitHub
      ansible.builtin.get_url:
        url: https://github.com/kiwiirc/kiwiirc/releases/download/v1.7.1/kiwiirc-client_v1.7.1-2_any.zip
        dest: /tmp/kiwiirc_download/kiwiirc.zip
        mode: "0644"
      when: refresh_apps or not kiwiirc_installed.stat.exists

    - name: Criar diretório do KiwiIRC
      ansible.builtin.file:
        path: "{{ app_dirs.kiwiirc }}"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Descompactar KiwiIRC
      ansible.builtin.unarchive:
        src: /tmp/kiwiirc_download/kiwiirc.zip
        dest: "{{ app_dirs.kiwiirc }}"
        remote_src: yes
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
      when: refresh_apps or not kiwiirc_installed.stat.exists

    # Overlay nosso (temas) — rápido e idempotente, sempre roda.
    - name: Sincronizar temas personalizados do KiwiIRC
      ansible.posix.synchronize:
        src: "usr/share/kiwiirc/static/"
        dest: "{{ app_dirs.kiwiirc }}/static/"
        delete: false
        recursive: true
        rsync_opts:
          - "--no-motd"
          - "-e 'ssh -p {{ ansible_port }}'"

    - name: Limpar arquivos temporários do KiwiIRC
      ansible.builtin.file:
        path: /tmp/kiwiirc_download
        state: absent

    # Build do plugin de conferência (Jitsi Meet) do KiwiIRC — clone + npm
    # install + webpack build é a etapa mais lenta do playbook inteiro, então
    # só roda de novo se refresh_apps=true ou o .js compilado ainda não existir.
    - name: Verificar se o plugin de conferência já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.kiwiirc }}/static/plugins/plugin-conference.js"
      register: plugin_conference_installed

    - name: Clonar plugin de conferência do KiwiIRC (plugin-conference)
      ansible.builtin.git:
        repo: https://github.com/kiwiirc/plugin-conference.git
        dest: /tmp/plugin-conference_build
        version: d32b1890b21329837c33a33638dcf24372573efa
        force: true
      when: refresh_apps or not plugin_conference_installed.stat.exists

    # Bug do plugin-conference: passa config.setting('configOverwrite') e
    # config.setting('interfaceConfigOverwrite') direto pro JitsiMeetExternalAPI.
    # No KiwiIRC atual (Vue 3) isso retorna um Proxy reativo, não um objeto
    # puro. Quando o external_api tenta repassar essas opções pro iframe via
    # postMessage, o Firefox lança "Permission denied to access property
    # '__v_isRef' on cross-origin object" ao tentar clonar o Proxy — o app do
    # Jitsi nunca termina de inicializar e a tela fica em branco. O patch
    # clona os objetos (JSON.parse/stringify) antes de passá-los, removendo
    # a reatividade do Vue.
    #
    # Segundo bug, mais grave: "this.api = new window.JitsiMeetExternalAPI(...)"
    # é atribuído a uma propriedade reativa do Vue (data() retorna api:null).
    # O Vue 3 torna esse objeto reativo recursivamente — e como o
    # JitsiMeetExternalAPI guarda uma referência ao Window do iframe
    # (cross-origin), toda vez que o Vue tenta rastrear esse objeto (a cada
    # mensagem que o iframe manda via postMessage, ex.: nível de áudio,
    # dezenas/segundo) o Firefox bloqueia o acesso a "__v_isRef" nesse objeto
    # cross-origin — gerando milhares de exceções e nunca disparando
    # "videoConferenceJoined" (loading infinito). O patch usa kiwi.Vue.markRaw
    # (exposto pelo próprio KiwiIRC) pra impedir o Vue de observar a instância.
    - name: "Patch: remover reatividade do Vue antes de passar config para o JitsiMeetExternalAPI"
      ansible.builtin.replace:
        path: /tmp/plugin-conference_build/src/components/JitsiMediaView.vue
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - regexp: "let configOverwrite = config\\.setting\\('configOverwrite'\\);"
          replace: "let configOverwrite = JSON.parse(JSON.stringify(config.setting('configOverwrite')));"
        - regexp: "interfaceConfigOverwrite: config\\.setting\\('interfaceConfigOverwrite'\\),"
          replace: "interfaceConfigOverwrite: JSON.parse(JSON.stringify(config.setting('interfaceConfigOverwrite'))),"
        - regexp: "this\\.api = new window\\.JitsiMeetExternalAPI\\(domain, options\\);"
          replace: "this.api = (kiwi.Vue && kiwi.Vue.markRaw ? kiwi.Vue.markRaw : (v) => v)(new window.JitsiMeetExternalAPI(domain, options));"
      loop_control:
        label: "{{ item.regexp }}"
      when: refresh_apps or not plugin_conference_installed.stat.exists

    - name: Instalar dependências do plugin de conferência
      ansible.builtin.shell: npm install
      args:
        chdir: /tmp/plugin-conference_build
      when: refresh_apps or not plugin_conference_installed.stat.exists
      changed_when: true

    - name: Compilar plugin de conferência
      ansible.builtin.shell: npm run build
      args:
        chdir: /tmp/plugin-conference_build
      when: refresh_apps or not plugin_conference_installed.stat.exists
      changed_when: true

    - name: Criar diretório de plugins do KiwiIRC
      ansible.builtin.file:
        path: "{{ app_dirs.kiwiirc }}/static/plugins"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Instalar plugin de conferência compilado
      ansible.builtin.copy:
        src: /tmp/plugin-conference_build/dist/plugin-conference.js
        dest: "{{ app_dirs.kiwiirc }}/static/plugins/plugin-conference.js"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0644"
        remote_src: true
      when: refresh_apps or not plugin_conference_installed.stat.exists

    - name: Limpar build temporário do plugin de conferência
      ansible.builtin.file:
        path: /tmp/plugin-conference_build
        state: absent

    # Configuração do WebIRC Gateway
    - name: Verificar se WebIRC Gateway já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.webircgateway }}/webircgateway"
      register: webircgateway_binary

    - name: Instalar Go (Debian/Ubuntu)
      ansible.builtin.package:
        name: golang
        state: present
      when: is_debian_family

    - name: Instalar Go (Oracle Linux/RHEL/Rocky)
      ansible.builtin.package:
        name: golang
        state: present
      when: is_rhel_family

    - name: Clonar repositório do WebIRC Gateway
      ansible.builtin.git:
        repo: https://github.com/kiwiirc/webircgateway.git
        dest: /tmp/webircgateway_build
        depth: 1
        force: true
      when: not webircgateway_binary.stat.exists

    - name: Compilar WebIRC Gateway
      ansible.builtin.command:
        cmd: go build -o webircgateway .
        chdir: /tmp/webircgateway_build
      environment:
        GOPATH: /tmp/go
        GOCACHE: /tmp/go-cache
      changed_when: true
      when: not webircgateway_binary.stat.exists

    - name: Criar diretório do WebIRC Gateway
      ansible.builtin.file:
        path: "{{ app_dirs.webircgateway }}"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Instalar binário do WebIRC Gateway
      ansible.builtin.copy:
        src: /tmp/webircgateway_build/webircgateway
        dest: "{{ app_dirs.webircgateway }}/webircgateway"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"
        remote_src: true
      when: not webircgateway_binary.stat.exists

    - name: Limpar diretório de build do WebIRC Gateway
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/webircgateway_build
        - /tmp/go
        - /tmp/go-cache

    - name: Criar diretório de configuração do WebIRC Gateway
      ansible.builtin.file:
        path: /etc/webircgateway
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copiar configuração do WebIRC Gateway
      ansible.builtin.copy:
        src: "opt/webircgateway/config.conf"
        dest: "/etc/webircgateway/config.conf"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0644"

    - name: Copiar certificado fullchain do Ergo
      ansible.builtin.copy:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}/fullchain.pem"
        dest: "{{ app_dirs.ergo }}/fullchain.pem"
        owner: "{{ ergo_user }}"
        group: "{{ nginx_group }}"
        mode: "0640"
        remote_src: true

    - name: Copiar chave privada do Ergo
      ansible.builtin.copy:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}/privkey.pem"
        dest: "{{ app_dirs.ergo }}/privkey.pem"
        owner: "{{ ergo_user }}"
        group: "{{ nginx_group }}"
        mode: "0640"
        remote_src: true

    # ===== JITSI MEET SELF-HOSTED (instalação nativa, sem Docker) =====
    # Usado pelo plugin "conference" do KiwiIRC (https://github.com/kiwiirc/plugin-conference).
    # Sem Docker nesta VPS. jicofo e jitsi-videobridge são extraídos
    # diretamente dos .deb oficiais (são arch "all" — jar + scripts Java/bash,
    # portanto rodam em qualquer distro/arquitetura com JRE, incluindo Oracle
    # Linux ARM). Prosody vem do EPEL. O frontend web é compilado a partir do
    # código-fonte de kiwiirc, igual ao Gamja. A lógica replica o que os
    # scripts postinst dos pacotes Debian fazem (ver debian/postinst dos repos
    # jitsi/jicofo, jitsi/jitsi-videobridge e jitsi/jitsi-meet no GitHub).

    - name: Instalar Java (RHEL/Oracle Linux)
      ansible.builtin.package:
        # Oracle Linux 10 só empacota o java-21-openjdk (não há java-17 no AppStream do EL10)
        name: "{{ 'java-21-openjdk-headless' if ansible_facts['distribution_major_version'] == '10' else 'java-17-openjdk-headless' }}"
        state: present
      when: is_rhel_family

    - name: Instalar Java (Debian/Ubuntu)
      ansible.builtin.package:
        name: openjdk-17-jre-headless
        state: present
      when: is_debian_family

    - name: Instalar binutils (necessário para extrair os .deb com ar)
      ansible.builtin.package:
        name: binutils
        state: present

    - name: Instalar EPEL (Oracle Linux / RHEL / Rocky)
      ansible.builtin.shell: |
        dnf install -y oracle-epel-release-el{{ ansible_facts['distribution_major_version'] }} 2>/dev/null \
          || dnf install -y epel-release
        dnf config-manager --set-enabled crb 2>/dev/null \
          || dnf config-manager --set-enabled powertools 2>/dev/null \
          || /usr/bin/crb enable 2>/dev/null || true
      args:
        creates: /etc/yum.repos.d/epel.repo
      when: is_rhel_family
      changed_when: true

    - name: Instalar Prosody (Oracle Linux / RHEL / Rocky, via EPEL)
      ansible.builtin.package:
        name: prosody
        state: present
      when: is_rhel_family

    # O nginx aqui vem do repositório oficial nginx-stable (nginx.org), que
    # não empacota o módulo geoip2. Por isso o ngx_http_geoip2_module.so é
    # compilado manualmente a partir do source — e se o nginx.org liberar uma
    # versão nova (o repo fica habilitado e o dnf update pega), o módulo
    # antigo passa a ter ABI incompatível ("module ... version X instead of
    # Y") até ser recompilado. O script cuida da detecção de versão e do
    # rebuild; é idempotente (sai com "SKIP" se já estiver em sincronia).
    - name: Copiar script de rebuild do módulo geoip2
      ansible.builtin.copy:
        src: files/rebuild-geoip2-module.sh
        dest: /usr/local/sbin/rebuild-geoip2-module.sh
        mode: "0755"
      when: is_rhel_family

    - name: Recompilar o módulo geoip2 se a versão do nginx mudou
      ansible.builtin.command: /usr/local/sbin/rebuild-geoip2-module.sh
      register: geoip2_rebuild
      changed_when: "'REBUILT' in geoip2_rebuild.stdout"
      notify: Reiniciar Nginx
      when: is_rhel_family

    - name: Instalar Prosody (Debian/Ubuntu)
      ansible.builtin.package:
        name: prosody
        state: present
      when: is_debian_family

    - name: "Garante que o grupo exista: jitsi"
      ansible.builtin.group:
        name: jitsi
        state: present

    - name: Criar usuário de sistema do jicofo
      ansible.builtin.user:
        name: jicofo
        group: jitsi
        create_home: true
        home: "{{ app_dirs.jicofo }}"
        shell: /bin/bash
        system: true

    - name: Criar usuário de sistema do jvb
      ansible.builtin.user:
        name: jvb
        group: jitsi
        create_home: true
        home: "{{ app_dirs.jvb }}"
        shell: /bin/bash
        system: true

    # nginx (usuário "nginx") não pertence ao grupo "jitsi", então mesmo com
    # /etc/jitsi/meet liberado para o grupo nginx, sem permissão de execução
    # ("x") em /etc/jitsi para "outros" o nginx não consegue nem atravessar o
    # diretório pai para chegar no config.js — open() falha com "Permission
    # denied" (403) e o Jitsi Meet trava numa tela preta de loading infinito,
    # porque window.config nunca é definido. Subdiretórios (jicofo/videobridge,
    # com credenciais) continuam 0750 e não ficam legíveis por "outros".
    - name: "Garantir que /etc/jitsi seja atravessável por outros serviços (ex.: nginx)" 
      ansible.builtin.file:
        path: /etc/jitsi
        state: directory
        mode: "0751"

    - name: Criar diretórios de configuração e log do Jitsi
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        # /var/log/jitsi é compartilhado pelo jicofo e pelo jvb (usuários
        # diferentes, mesmo grupo "jitsi") — precisa de escrita de grupo
        # (0770), senão o jvb.sh não consegue criar o jvb.log e o serviço
        # morre com "Permission denied" no primeiro start.
        mode: "{{ '0770' if item == '/var/log/jitsi' else '0750' }}"
        owner: "{{ 'jicofo' if 'jicofo' in item else ('jvb' if 'videobridge' in item else 'root') }}"
        group: jitsi
      loop:
        - /etc/jitsi/jicofo
        - /etc/jitsi/videobridge
        - /var/log/jitsi

    # jvb.sh só faz "echo >> jvb.log", sem nenhuma rotação própria — sem
    # logrotate o arquivo cresce sem limite (já vimos 8GB+ num loop de
    # reconexão TLS). copytruncate evita ter que sinalizar o processo.
    - name: Configurar logrotate para os logs do Jitsi
      ansible.builtin.copy:
        dest: /etc/logrotate.d/jitsi
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/log/jitsi/*.log {
              daily
              rotate 7
              missingok
              notifempty
              compress
              delaycompress
              copytruncate
              maxsize 200M
          }

    # /etc/jitsi/meet só guarda o config.js público (servido pelo nginx via
    # SSI no index.html e via fetch direto do navegador, "/config.js?room=").
    # Diferente de jicofo/videobridge (que guardam credenciais e por isso
    # ficam 0750 grupo "jitsi"), aqui o grupo é o do nginx — senão o nginx
    # nem consegue atravessar o diretório para ler o arquivo
    # ("open() ... failed (13: Permission denied)").
    - name: Criar diretório de configuração do Jitsi Meet (config.js público)
      ansible.builtin.file:
        path: /etc/jitsi/meet
        state: directory
        mode: "0750"
        owner: root
        group: "{{ nginx_group }}"

    - name: Configurar contexto SELinux para /etc/jitsi/meet (config.js servido pelo nginx)
      community.general.sefcontext:
        target: "/etc/jitsi/meet(/.*)?"
        setype: httpd_sys_content_t
        state: present
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    - name: Aplicar contexto SELinux em /etc/jitsi/meet
      ansible.builtin.command: restorecon -Rv /etc/jitsi/meet
      changed_when: true
      when: is_rhel_family and selinux_status.stdout == "Enforcing"

    # --- jicofo (extraído do .deb oficial — é "arch: all", jar puro) ---
    - name: Verificar se o jicofo já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.jicofo }}/jicofo.jar"
      register: jicofo_installed

    - name: Baixar .deb do jicofo
      ansible.builtin.get_url:
        url: "https://download.jitsi.org/stable/jicofo_{{ jitsi_jicofo_deb_version }}_all.deb"
        dest: /tmp/jicofo.deb
        mode: "0644"
      when: refresh_apps or not jicofo_installed.stat.exists

    - name: Extrair .deb do jicofo
      ansible.builtin.shell: |
        rm -rf /tmp/jicofo_extract && mkdir -p /tmp/jicofo_extract
        cd /tmp/jicofo_extract
        ar x /tmp/jicofo.deb
        tar -xf data.tar.*
      when: refresh_apps or not jicofo_installed.stat.exists
      changed_when: true

    - name: Instalar arquivos do jicofo
      ansible.posix.synchronize:
        src: "/tmp/jicofo_extract/usr/share/jicofo/"
        dest: "{{ app_dirs.jicofo }}/"
        delete: false
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: refresh_apps or not jicofo_installed.stat.exists

    - name: Instalar logging.properties do jicofo (se ainda não existir)
      ansible.builtin.copy:
        src: /tmp/jicofo_extract/etc/jitsi/jicofo/logging.properties
        dest: /etc/jitsi/jicofo/logging.properties
        remote_src: true
        owner: jicofo
        group: jitsi
        mode: "0640"
        force: false
      when: refresh_apps or not jicofo_installed.stat.exists

    - name: Ajustar propriedade dos arquivos do jicofo
      ansible.builtin.file:
        path: "{{ app_dirs.jicofo }}"
        owner: jicofo
        group: jitsi
        recurse: true

    # --- jitsi-videobridge (jvb) — mesma lógica, .deb "arch: all" ---
    - name: Verificar se o jvb já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.jvb }}/jitsi-videobridge.jar"
      register: jvb_installed

    - name: Baixar .deb do jitsi-videobridge2
      ansible.builtin.get_url:
        url: "https://download.jitsi.org/stable/jitsi-videobridge2_{{ jitsi_jvb_deb_version }}_all.deb"
        dest: /tmp/jvb.deb
        mode: "0644"
      when: refresh_apps or not jvb_installed.stat.exists

    - name: Extrair .deb do jvb
      ansible.builtin.shell: |
        rm -rf /tmp/jvb_extract && mkdir -p /tmp/jvb_extract
        cd /tmp/jvb_extract
        ar x /tmp/jvb.deb
        tar -xf data.tar.*
      when: refresh_apps or not jvb_installed.stat.exists
      changed_when: true

    - name: Instalar arquivos do jvb
      ansible.posix.synchronize:
        src: "/tmp/jvb_extract/usr/share/jitsi-videobridge/"
        dest: "{{ app_dirs.jvb }}/"
        delete: false
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: refresh_apps or not jvb_installed.stat.exists

    - name: Instalar logging.properties do jvb (se ainda não existir)
      ansible.builtin.copy:
        src: /tmp/jvb_extract/etc/jitsi/videobridge/logging.properties
        dest: /etc/jitsi/videobridge/logging.properties
        remote_src: true
        owner: jvb
        group: jitsi
        mode: "0640"
        force: false
      when: refresh_apps or not jvb_installed.stat.exists

    - name: Ajustar propriedade dos arquivos do jvb
      ansible.builtin.file:
        path: "{{ app_dirs.jvb }}"
        owner: jvb
        group: jitsi
        recurse: true

    - name: Limpar downloads/extrações temporárias do jicofo/jvb
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/jicofo.deb
        - /tmp/jicofo_extract
        - /tmp/jvb.deb
        - /tmp/jvb_extract

    # Senhas internas do Jitsi (XMPP), geradas uma única vez e persistidas
    # localmente (fora do vault, que é criptografado manualmente) — ver
    # .gitignore: ansible/.secrets/ nunca é versionado.
    - name: Gerar/recuperar senhas internas do Jitsi
      ansible.builtin.set_fact:
        jitsi_jicofo_auth_password: "{{ lookup('password', playbook_dir + '/.secrets/jitsi/jicofo_auth_password length=32 chars=ascii_letters,digits') }}"
        jitsi_jvb_auth_password: "{{ lookup('password', playbook_dir + '/.secrets/jitsi/jvb_auth_password length=32 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Gerar jicofo.conf (HOCON)
      ansible.builtin.copy:
        dest: /etc/jitsi/jicofo/jicofo.conf
        owner: jicofo
        group: jitsi
        mode: "0640"
        content: |
          jicofo {
            xmpp {
              client {
                client-proxy = "focus.{{ domains.meet }}"
                xmpp-domain = "{{ domains.meet }}"
                domain = "auth.{{ domains.meet }}"
                username = "focus"
                password = "{{ jitsi_jicofo_auth_password }}"
                # auth.{{ domains.meet }} é um vhost XMPP interno (não público);
                # o certificado TLS é o do domínio principal e nunca terá esse SAN.
                disable-certificate-verification = true
              }
              trusted-domains = [ "recorder.{{ domains.meet }}" ]
            }
            bridge {
              brewery-jid = "JvbBrewery@internal.auth.{{ domains.meet }}"
            }
          }
      no_log: true
      notify: Reiniciar serviços jitsi

    - name: Gerar jvb.conf (HOCON)
      ansible.builtin.copy:
        dest: /etc/jitsi/videobridge/jvb.conf
        owner: jvb
        group: jitsi
        mode: "0640"
        content: |
          videobridge {
            apis.xmpp-client.configs {
              shard {
                HOSTNAME = "localhost"
                DOMAIN = "auth.{{ domains.meet }}"
                USERNAME = "jvb"
                PASSWORD = "{{ jitsi_jvb_auth_password }}"
                MUC_JIDS = "JvbBrewery@internal.auth.{{ domains.meet }}"
                MUC_NICKNAME = "{{ ansible_facts['hostname'] }}"
                # auth.{{ domains.meet }} é um vhost XMPP interno (não público);
                # o certificado TLS é o do domínio principal e nunca terá esse SAN.
                DISABLE_CERTIFICATE_VERIFICATION = true
              }
            }
          }
          ice4j {
            harvest.mapping.stun.addresses = [ "meet-jit-si-turnrelay.jitsi.net:443" ]
          }
      no_log: true
      notify: Reiniciar serviços jitsi

    - name: Gerar arquivo de ambiente do jicofo (systemd EnvironmentFile)
      ansible.builtin.copy:
        dest: /etc/jitsi/jicofo/config
        owner: jicofo
        group: jitsi
        mode: "0640"
        content: |
          JAVA_SYS_PROPS="-Dnet.java.sip.communicator.SC_HOME_DIR_LOCATION=/etc/jitsi -Dnet.java.sip.communicator.SC_HOME_DIR_NAME=jicofo -Dnet.java.sip.communicator.SC_LOG_DIR_LOCATION=/var/log/jitsi -Djava.util.logging.config.file=/etc/jitsi/jicofo/logging.properties -Dconfig.file=/etc/jitsi/jicofo/jicofo.conf"
      notify: Reiniciar serviços jitsi

    - name: Gerar arquivo de ambiente do jvb (systemd EnvironmentFile)
      ansible.builtin.copy:
        dest: /etc/jitsi/videobridge/config
        owner: jvb
        group: jitsi
        mode: "0640"
        content: |
          JAVA_SYS_PROPS="-Dnet.java.sip.communicator.SC_HOME_DIR_LOCATION=/etc/jitsi -Dnet.java.sip.communicator.SC_HOME_DIR_NAME=videobridge -Dnet.java.sip.communicator.SC_LOG_DIR_LOCATION=/var/log/jitsi -Djava.util.logging.config.file=/etc/jitsi/videobridge/logging.properties -Dconfig.file=/etc/jitsi/videobridge/jvb.conf"

      notify: Reiniciar serviços jitsi

    # --- Prosody (XMPP) ---
    - name: Garantir que o prosody.cfg.lua principal inclua conf.d/*.cfg.lua
      ansible.builtin.lineinfile:
        path: /etc/prosody/prosody.cfg.lua
        line: 'Include "conf.d/*.cfg.lua"'
        insertafter: EOF
      register: prosody_main_config

    - name: Copiar certificado fullchain para o Prosody
      ansible.builtin.copy:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}/fullchain.pem"
        dest: "/etc/prosody/certs/{{ domains.meet }}.crt"
        owner: prosody
        group: prosody
        mode: "0640"
        remote_src: true

    - name: Copiar chave privada para o Prosody
      ansible.builtin.copy:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}/privkey.pem"
        dest: "/etc/prosody/certs/{{ domains.meet }}.key"
        owner: prosody
        group: prosody
        mode: "0640"
        remote_src: true

    - name: Gerar config do VirtualHost do Prosody para o Jitsi Meet
      ansible.builtin.template:
        src: etc/prosody/jitsi-meet.cfg.lua.j2
        dest: "/etc/prosody/conf.d/{{ domains.meet }}.cfg.lua"
        owner: prosody
        group: prosody
        mode: "0640"
      register: prosody_jitsi_config
      no_log: true

    - name: Garantir que o Prosody esteja habilitado e iniciado
      ansible.builtin.systemd:
        name: prosody
        enabled: true
        state: started

    - name: Reiniciar o Prosody se alguma config mudou (main config ou VirtualHost do Jitsi)
      ansible.builtin.systemd:
        name: prosody
        state: restarted
      when: prosody_main_config.changed or prosody_jitsi_config.changed

    - name: Aguardar o Prosody carregar o VirtualHost do Jitsi Meet
      ansible.builtin.pause:
        seconds: 5
      when: prosody_main_config.changed or prosody_jitsi_config.changed

    - name: Criar/atualizar usuário XMPP do jicofo (focus) no Prosody
      ansible.builtin.command:
        argv:
          - prosodyctl
          - register
          - focus
          - "auth.{{ domains.meet }}"
          - "{{ jitsi_jicofo_auth_password }}"
      register: jicofo_prosody_user
      failed_when: jicofo_prosody_user.rc != 0
      changed_when: jicofo_prosody_user.rc == 0
      no_log: true

    - name: Criar/atualizar usuário XMPP do jvb no Prosody
      ansible.builtin.command:
        argv:
          - prosodyctl
          - register
          - jvb
          - "auth.{{ domains.meet }}"
          - "{{ jitsi_jvb_auth_password }}"
      register: jvb_prosody_user
      failed_when: jvb_prosody_user.rc != 0
      changed_when: jvb_prosody_user.rc == 0
      no_log: true

    # --- Frontend web + prosody-plugins ---
    # Extraídos dos .deb oficiais já compilados (jitsi-meet-web, jitsi-meet-prosody).
    # Evita compilar o webpack do jitsi-meet na própria VPS: é um build pesado
    # (recomendado ~8GB de heap) que travava/ficava horas numa VPS ARM pequena.
    - name: Verificar se o frontend do jitsi-meet já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.jitsimeet }}/libs"
      register: jitsimeet_installed

    - name: Baixar .deb do jitsi-meet-web
      ansible.builtin.get_url:
        url: "https://download.jitsi.org/stable/jitsi-meet-web_{{ jitsi_meet_web_deb_version }}_all.deb"
        dest: /tmp/jitsi-meet-web.deb
        mode: "0644"
      when: refresh_apps or not jitsimeet_installed.stat.exists

    - name: Baixar .deb do jitsi-meet-prosody (contém os prosody-plugins)
      ansible.builtin.get_url:
        url: "https://download.jitsi.org/stable/jitsi-meet-prosody_{{ jitsi_meet_web_deb_version }}_all.deb"
        dest: /tmp/jitsi-meet-prosody.deb
        mode: "0644"
      when: refresh_apps or not jitsimeet_installed.stat.exists

    - name: Extrair .deb do jitsi-meet-web e jitsi-meet-prosody
      ansible.builtin.shell: |
        rm -rf /tmp/jitsimeet_extract && mkdir -p /tmp/jitsimeet_extract
        cd /tmp/jitsimeet_extract
        for deb in /tmp/jitsi-meet-web.deb /tmp/jitsi-meet-prosody.deb; do
          mkdir -p "$(basename $deb .deb)"
          (cd "$(basename $deb .deb)" && ar x "$deb" && tar -xf data.tar.*)
        done
      when: refresh_apps or not jitsimeet_installed.stat.exists
      changed_when: true

    - name: Criar diretório do frontend do Jitsi Meet
      ansible.builtin.file:
        path: "{{ app_dirs.jitsimeet }}"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Instalar arquivos do frontend web (jitsi-meet-web)
      ansible.posix.synchronize:
        src: "/tmp/jitsimeet_extract/jitsi-meet-web/usr/share/jitsi-meet/"
        dest: "{{ app_dirs.jitsimeet }}/"
        delete: false
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: refresh_apps or not jitsimeet_installed.stat.exists

    - name: Instalar prosody-plugins (jitsi-meet-prosody)
      ansible.posix.synchronize:
        src: "/tmp/jitsimeet_extract/jitsi-meet-prosody/usr/share/jitsi-meet/prosody-plugins/"
        dest: "{{ app_dirs.jitsimeet }}/prosody-plugins/"
        delete: false
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: refresh_apps or not jitsimeet_installed.stat.exists

    - name: Ajustar propriedade dos arquivos do jitsi-meet
      ansible.builtin.file:
        path: "{{ app_dirs.jitsimeet }}"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        recurse: true

    # O Component "focus.{{ domains.meet }}" "client_proxy" (ver
    # etc/prosody/jitsi-meet.cfg.lua.j2) só consegue rotear o IQ de "criar
    # conferência" pro jicofo se existir uma assinatura de roster (presence
    # subscription) prévia entre o componente e o usuário focus@auth.{{
    # domains.meet }}. mod_client_proxy.lua manda essa assinatura sozinho,
    # mas só UMA VEZ, no boot do Prosody — se o jicofo ainda não tiver
    # autenticado naquele instante (ele é mais lento pra subir que o
    # Prosody), a assinatura se perde e fica perdida pra sempre, porque sem
    # registro no roster o Prosody não tem nada pra reenviar depois. O
    # sintoma final no navegador: a webcam fica em "loading" infinito e o
    # console mostra "Strophe error ... reason: service-unavailable ...
    # operation: conference request (IQ) ... targetJid: focus.{{ domains.meet
    # }}" — o IQ nunca chega no jicofo (ver jicofo.log: nenhuma entrada).
    # mod_roster_command.lua (extraído junto dos outros prosody-plugins,
    # acima) resolve isso definitivamente gravando a assinatura direto no
    # roster armazenado em disco — não depende mais de timing de boot.
    # Comentário do próprio autor do módulo confirma esse uso:
    # "Used by Ansible to subscribe focus.<domain> to focus@auth.<domain>".
    #
    # Só precisa rodar uma vez (a assinatura fica persistida em disco pelo
    # Prosody) — um marker file evita reexecutar o comando e reiniciar os
    # serviços jitsi a cada "ansible-playbook" (ver feedback sobre o
    # playbook repetir tarefas desnecessárias).
    - name: Verificar se a assinatura de roster do client_proxy já foi feita
      ansible.builtin.stat:
        path: /etc/jitsi/.client_proxy_roster_subscribed
      register: jitsi_roster_subscribed

    - name: Assinar roster do client_proxy -> focus (necessário pro jicofo criar conferências)
      ansible.builtin.command:
        argv:
          - prosodyctl
          - mod_roster_command
          - subscribe
          - "focus.{{ domains.meet }}"
          - "focus@auth.{{ domains.meet }}"
      register: jitsi_roster_subscribe
      changed_when: true
      failed_when: jitsi_roster_subscribe.rc != 0
      when: not jitsi_roster_subscribed.stat.exists
      notify: Reiniciar serviços jitsi

    - name: Marcar assinatura de roster do client_proxy como feita
      ansible.builtin.file:
        path: /etc/jitsi/.client_proxy_roster_subscribed
        state: touch
        owner: root
        group: jitsi
        mode: "0640"
      when: not jitsi_roster_subscribed.stat.exists

    - name: Limpar downloads/extrações temporárias do jitsi-meet
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/jitsi-meet-web.deb
        - /tmp/jitsi-meet-prosody.deb
        - /tmp/jitsimeet_extract

    - name: Gerar config.js do Jitsi Meet
      ansible.builtin.copy:
        dest: "/etc/jitsi/meet/{{ domains.meet }}-config.js"
        owner: root
        group: "{{ nginx_group }}"
        mode: "0644"
        content: |
          var config = {
              hosts: {
                  domain: '{{ domains.meet }}',
                  muc: 'conference.{{ domains.meet }}',
              },
              bosh: '//{{ domains.meet }}/http-bind',
              websocket: 'wss://{{ domains.meet }}/xmpp-websocket',
              clientNode: 'https://jitsi.org/jitsi-meet',
          };
        force: false

    # ===== SOJU =====
    - name: Criar diretório de configuração do soju
      ansible.builtin.file:
        path: /etc/soju
        state: directory
        owner: "{{ soju_user }}"
        group: "{{ soju_group }}"
        mode: "0750"

    - name: Criar diretório de estado do soju
      ansible.builtin.file:
        path: /var/lib/soju
        state: directory
        owner: "{{ soju_user }}"
        group: "{{ soju_group }}"
        mode: "0750"

    - name: Copiar configuração do soju
      ansible.builtin.copy:
        src: "etc/soju/config"
        dest: "/etc/soju/config"
        owner: "{{ soju_user }}"
        group: "{{ soju_group }}"
        mode: "0640"

    - name: Copiar certificado fullchain do soju
      ansible.builtin.copy:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}/fullchain.pem"
        dest: "/etc/soju/fullchain.pem"
        owner: "{{ soju_user }}"
        group: "{{ soju_group }}"
        mode: "0640"
        remote_src: true

    - name: Copiar chave privada do soju
      ansible.builtin.copy:
        src: "{{ ssl_cert_dir }}/{{ domains.irc }}/privkey.pem"
        dest: "/etc/soju/privkey.pem"
        owner: "{{ soju_user }}"
        group: "{{ soju_group }}"
        mode: "0600"
        remote_src: true

    # ===== MATTERBRIDGE (ponte IRC <-> Telegram, opcional) =====
    # Só é instalada/habilitada se telegram_bot_token e telegram_chat_id
    # estiverem definidos no vault (./scripts/vault.sh edit). Sem eles, este
    # bloco inteiro é ignorado e nada relacionado ao Telegram é tocado —
    # não afeta o Ergo/KiwiIRC/Gamja/The Lounge já em produção.
    - name: Verificar se o Matterbridge já está instalado
      ansible.builtin.stat:
        path: "{{ app_dirs.matterbridge }}/matterbridge"
      register: matterbridge_binary
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Clonar repositório do Matterbridge
      ansible.builtin.git:
        repo: https://github.com/42wim/matterbridge.git
        dest: /tmp/matterbridge_build
        depth: 1
        force: true
      when:
        - telegram_bot_token is defined and telegram_chat_id is defined
        - not matterbridge_binary.stat.exists

    - name: Compilar Matterbridge
      ansible.builtin.command:
        cmd: go build -o matterbridge .
        chdir: /tmp/matterbridge_build
      environment:
        GOPATH: /tmp/go
        GOCACHE: /tmp/go-cache
      changed_when: true
      when:
        - telegram_bot_token is defined and telegram_chat_id is defined
        - not matterbridge_binary.stat.exists

    - name: Criar diretório do Matterbridge
      ansible.builtin.file:
        path: "{{ app_dirs.matterbridge }}"
        state: directory
        owner: "{{ matterbridge_user }}"
        group: "{{ matterbridge_group }}"
        mode: "0755"
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Instalar binário do Matterbridge
      ansible.builtin.copy:
        src: /tmp/matterbridge_build/matterbridge
        dest: "{{ app_dirs.matterbridge }}/matterbridge"
        owner: "{{ matterbridge_user }}"
        group: "{{ matterbridge_group }}"
        mode: "0755"
        remote_src: true
      when:
        - telegram_bot_token is defined and telegram_chat_id is defined
        - not matterbridge_binary.stat.exists

    - name: Limpar diretório de build do Matterbridge
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/matterbridge_build
        - /tmp/go
        - /tmp/go-cache
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Criar diretório de configuração do Matterbridge
      ansible.builtin.file:
        path: /etc/matterbridge
        state: directory
        owner: "{{ matterbridge_user }}"
        group: "{{ matterbridge_group }}"
        mode: "0750"
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Gerar configuração do Matterbridge (token do Telegram fica só neste arquivo, modo 0640)
      ansible.builtin.template:
        src: "etc/matterbridge/matterbridge.toml.j2"
        dest: "/etc/matterbridge/matterbridge.toml"
        owner: "{{ matterbridge_user }}"
        group: "{{ matterbridge_group }}"
        mode: "0640"
      notify: Reiniciar Matterbridge
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Verificar instalação final do Node.js e npm
      ansible.builtin.command: "{{ item }}"
      loop:
        - "node --version"
        - "npm --version"
      register: nodejs_final_versions
      changed_when: false
      failed_when: false

    - name: Falhar se Node.js ou npm não estiver funcionando
      ansible.builtin.fail:
        msg: "Node.js ou npm não está funcionando. Via snap: snap install node --classic | Via nvm: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash && nvm install node"
      when: nodejs_final_versions.results[0].rc != 0 or nodejs_final_versions.results[1].rc != 0

    - name: Criar diretório do Gamja
      ansible.builtin.file:
        path: "{{ app_dirs.gamja }}"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Verificar se o build do Gamja já existe
      ansible.builtin.stat:
        path: "{{ app_dirs.gamja }}/dist/index.html"
      register: gamja_built

    - name: Executar npm install no Gamja
      ansible.builtin.shell: |
        cd "{{ app_dirs.gamja }}"
        npm install --include=dev
      args:
        chdir: "{{ app_dirs.gamja }}"
      when: >
        (refresh_apps or not gamja_built.stat.exists) and
        nodejs_final_versions.results[0].rc == 0 and
        nodejs_final_versions.results[1].rc == 0

    - name: Executar build do Gamja (parcel)
      ansible.builtin.shell: |
        cd "{{ app_dirs.gamja }}"
        npm run build
      args:
        chdir: "{{ app_dirs.gamja }}"
      when: >
        (refresh_apps or not gamja_built.stat.exists) and
        nodejs_final_versions.results[0].rc == 0 and
        nodejs_final_versions.results[1].rc == 0
      register: gamja_build_result

    # Instalação do The Lounge via pnpm
    - name: Instalar pnpm via corepack
      ansible.builtin.shell: |
        corepack enable
        corepack prepare pnpm@latest --activate
      args:
        creates: /usr/local/bin/pnpm
      when: >
        nodejs_final_versions.results[0].rc == 0 and
        nodejs_final_versions.results[1].rc == 0

    - name: Criar diretório do The Lounge
      ansible.builtin.file:
        path: "{{ app_dirs.thelounge }}"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Instalar yarn globalmente via npm
      ansible.builtin.shell: npm install -g yarn
      args:
        creates: /usr/local/bin/yarn
      when: >
        nodejs_final_versions.results[0].rc == 0 and
        nodejs_final_versions.results[1].rc == 0

    - name: Verificar se o The Lounge já está instalado
      ansible.builtin.stat:
        path: /usr/local/bin/thelounge
      register: thelounge_installed

    - name: Instalar The Lounge via yarn
      ansible.builtin.shell: yarn global add thelounge
      when: >
        (refresh_apps or not thelounge_installed.stat.exists) and
        nodejs_final_versions.results[0].rc == 0 and
        nodejs_final_versions.results[1].rc == 0

    - name: Encontrar binário do thelounge após instalação
      ansible.builtin.shell: which thelounge || npm bin -g | xargs -I{} ls {}/thelounge 2>/dev/null
      register: thelounge_bin_path
      changed_when: false
      failed_when: false

    - name: Criar link simbólico para thelounge em /usr/local/bin
      ansible.builtin.file:
        src: "{{ thelounge_bin_path.stdout | trim }}"
        dest: /usr/local/bin/thelounge
        state: link
        force: yes
      when:
        - thelounge_bin_path.rc == 0
        - thelounge_bin_path.stdout | trim != ''
        - thelounge_bin_path.stdout | trim != '/usr/local/bin/thelounge'

    - name: Criar diretório de configuração do The Lounge
      ansible.builtin.file:
        path: /etc/thelounge
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0755"

    - name: Copiar arquivo de configuração do The Lounge
      ansible.builtin.copy:
        src: "etc/thelounge/config.js"
        dest: "/etc/thelounge/config.js"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "0644"

    - name: Criar diretório de configuração do kiwiirc
      ansible.builtin.file:
        path: /etc/kiwiirc
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copiar arquivo de configuração do kiwiirc
      ansible.builtin.copy:
        src: "etc/kiwiirc/client.json"
        dest: "/etc/kiwiirc/client.json"
        owner: root
        group: root
        mode: "0644"

    - name: Alterar propriedade do diretório kiwiirc
      ansible.builtin.file:
        path: "{{ app_dirs.kiwiirc }}"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        recurse: true
        state: directory

    - name: Alterar propriedade do diretório gamja
      ansible.builtin.file:
        path: "{{ app_dirs.gamja }}"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        recurse: true
        state: directory

    - name: Alterar propriedade do diretório ergo
      ansible.builtin.file:
        path: "{{ app_dirs.ergo }}"
        owner: "{{ ergo_user }}"
        group: "{{ ergo_group }}"
        recurse: true
        state: directory

    - name: Alterar propriedade do diretório webircgateway
      ansible.builtin.file:
        path: "{{ app_dirs.webircgateway }}"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        recurse: true
        state: directory

    - name: Alterar propriedade do diretório thelounge
      ansible.builtin.file:
        path: "{{ app_dirs.thelounge }}"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        recurse: true
        state: directory

    - name: Aplicar contextos SELinux nos diretórios de aplicação
      ansible.builtin.command: "restorecon -Rv {{ item }}"
      loop:
        - "{{ app_dirs.ergo }}"
        - "{{ app_dirs.kiwiirc }}"
        - "{{ app_dirs.gamja }}"
        - "{{ app_dirs.webircgateway }}"
        - "{{ app_dirs.thelounge }}"
      when: is_rhel_family and selinux_status.stdout == "Enforcing"
      changed_when: true

    - name: Aplicar contexto SELinux no diretório do Matterbridge
      ansible.builtin.command: "restorecon -Rv {{ app_dirs.matterbridge }}"
      when:
        - is_rhel_family and selinux_status.stdout == "Enforcing"
        - telegram_bot_token is defined and telegram_chat_id is defined
      changed_when: true

    - name: Copiar configurações do Nginx
      ansible.builtin.copy:
        src: "etc/nginx/sites.d/{{ item }}"
        dest: "/etc/nginx/sites.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        force: true
      loop:
        - "12-{{ domains.irc }}.conf"
        - "13-{{ domains.gamja }}.conf"
        - "14-{{ domains.chat }}.conf"
        - "15-{{ domains.lounge }}.conf"
        - "16-{{ domains.meet }}.conf"
      notify: Reiniciar Nginx

    - name: Aplicar reinício do Nginx imediatamente se config mudou
      ansible.builtin.meta: flush_handlers

    - name: Copiar serviços systemd
      ansible.builtin.copy:
        src: "etc/systemd/system/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      notify: # Aciona recarregamento se o arquivo mudar
        - Reiniciar serviços
        - Reiniciar serviços jitsi
      loop:
        - "somdomato-ergo.service"
        - "somdomato-kiwiirc.service"
        - "somdomato-webircgateway.service"
        - "somdomato-thelounge.service"
        - "somdomato-soju.service"
        - "jicofo.service"
        - "jitsi-videobridge2.service"

    - name: Copiar serviço systemd do Matterbridge
      ansible.builtin.copy:
        src: "etc/systemd/system/somdomato-matterbridge.service"
        dest: "/etc/systemd/system/somdomato-matterbridge.service"
        owner: root
        group: root
        mode: "0644"
      notify: Reiniciar Matterbridge
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Abrir portas no firewall (Oracle Linux / RHEL)
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - "80/tcp"
        - "443/tcp"
        - "6697/tcp"
        - "6698/tcp"
        - "8067/tcp"
        - "10000/udp"
      when: is_rhel_family

    - name: Habilitar e iniciar serviços
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - "somdomato-ergo.service"
        - "somdomato-webircgateway.service"
        - "somdomato-thelounge.service"
        - "somdomato-soju.service"
        - "jicofo.service"
        - "jitsi-videobridge2.service"
        - nginx

    - name: Habilitar e iniciar o Matterbridge (ponte Telegram)
      ansible.builtin.systemd:
        name: "somdomato-matterbridge.service"
        enabled: true
        state: started
        daemon_reload: true
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Aguardar socket admin do soju estar disponível
      ansible.builtin.wait_for:
        path: /var/run/soju/admin
        timeout: 15
      when: soju_admin_password is defined

    - name: Criar usuário admin do soju (se ainda não existir)
      ansible.builtin.shell: >
        /usr/local/bin/sojuctl -config /etc/soju/config user create
        -username {{ soju_admin_user | default('admin') }}
        -password {{ soju_admin_password }}
        -admin
      register: soju_user_create
      failed_when:
        - soju_user_create.rc != 0
        - "'already exists' not in soju_user_create.stderr"
        - "'already exists' not in soju_user_create.stdout"
      changed_when: soju_user_create.rc == 0
      when: soju_admin_password is defined

  handlers:
    - name: Mostrar resultado do certbot
      ansible.builtin.debug:
        var: certbot_result

    - name: Reiniciar serviços
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        state: restarted
      loop:
        - "somdomato-ergo.service"
        - "somdomato-webircgateway.service"
        - "somdomato-thelounge.service"
        - "somdomato-soju.service"

    - name: Reiniciar serviços jitsi
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        state: restarted
      loop:
        - "jicofo.service"
        - "jitsi-videobridge2.service"
        # - "somdomato-kiwiirc.service"  # Apenas se necessário

    - name: Reiniciar Matterbridge
      ansible.builtin.systemd:
        name: "somdomato-matterbridge.service"
        daemon_reload: true
        state: restarted
      when: telegram_bot_token is defined and telegram_chat_id is defined

    - name: Testar configuração do Nginx
      ansible.builtin.command: nginx -t
      register: nginx_test
      failed_when: false
      listen: Reiniciar Nginx

    - name: Mostrar erro de configuração do Nginx se houver
      ansible.builtin.debug:
        msg:
          - "❌ Erro na configuração do Nginx:"
          - "{{ nginx_test.stderr }}"
          - "🔧 Verifique os certificados SSL em /etc/letsencrypt/live/"
      when: nginx_test.rc != 0
      listen: Reiniciar Nginx

    - name: Reiniciar Nginx apenas se configuração estiver válida
      ansible.builtin.systemd:
        name: nginx
        state: restarted
      when: nginx_test.rc == 0
      listen: Reiniciar Nginx

    - name: Falhar se configuração do Nginx estiver inválida
      ansible.builtin.fail:
        msg: "Configuração do Nginx inválida. Corrija os erros antes de prosseguir."
      when: nginx_test.rc != 0
      listen: Reiniciar Nginx
